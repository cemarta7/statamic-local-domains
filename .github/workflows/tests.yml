name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.40'
            statamic: '^5.0'
          - php: '8.3'
            laravel: '^12.0'
            statamic: '^6.0'
          - php: '8.4'
            laravel: '^13.0'
            statamic: '^6.0'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, exif, gd, intl, mbstring, zip
          coverage: none
      - run: composer update --with "laravel/framework:${{ matrix.laravel }}" --with "statamic/cms:${{ matrix.statamic }}" --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer test
